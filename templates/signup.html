<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Study Workspace</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand auth-brand">
      <span class="brand-icon">📚</span>
      <div>
        <h1>Study Workspace</h1>
        <p>Create your account and start studying smarter</p>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-list">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('signup_page') }}" class="auth-form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required
             minlength="2" maxlength="100" value="{{ name or '' }}" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8" />

      <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
  </div>
</body>
</html>
